# skillgen platform manifest — Dreamliner Codex-only variant
#
# Build-time only. This file (and everything under tools/skillgen/) is NOT
# shipped in the wheel; it drives the render of the committed skill artifacts
# under graphify/. Run `python -m tools.skillgen` from the repo root to
# regenerate, `--check` to fail on drift, `--bless` to refresh expected/.
#
# This fork ships Codex only. Other hosts are not first-class targets.

[platform.codex]
bucket = "split"
core = "core"
skill_dst = "graphify/skill-codex.md"
refs_dst = "graphify/skills/codex/references"
name = "dreamliner"
description = "Use for any question about a codebase, its architecture, file relationships, or project content — especially when graphify-out/ exists, where the question should be treated as a Dreamliner query first. Turns any input (code, docs, papers, images, videos) into a persistent knowledge graph with god nodes, community detection, and query/path/explain tools. Codex-only."
dispatch = "codex-agenttask"
extraction = "compact"
shell = "posix"
hooks_variant = "agents-md"
